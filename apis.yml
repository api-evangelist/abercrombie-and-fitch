description: >-
  Abercrombie & Fitch is a global specialty retailer of casual apparel, accessories,
  and personal care products operating multiple lifestyle brands including Abercrombie,
  Hollister, and Gilly Hicks. The company operates through a direct-to-consumer model
  with both e-commerce and physical retail stores across global markets.
